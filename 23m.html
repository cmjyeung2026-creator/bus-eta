<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小巴 23M 到站時間 - 麗港城</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: #00d4ff; margin-bottom: 10px; font-size: 2rem; }
    .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
    .route-info { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .route-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .route-number { background: #0f3460; color: #00d4ff; padding: 10px 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; }
    .route-direction { color: #aaa; }
    .stations { display: flex; flex-direction: column; gap: 15px; }
    .station { background: #0f3460; border-radius: 8px; padding: 15px; border-left: 4px solid #00d4ff; }
    .station-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; }
    .eta-list { display: flex; gap: 10px; flex-wrap: wrap; }
    .eta { background: #1a1a2e; padding: 8px 15px; border-radius: 6px; font-size: 0.95rem; }
    .eta.soon { background: #00d4ff; color: #000; font-weight: bold; }
    .eta.scheduled { background: #333; color: #888; }
    .refresh-btn { display: block; width: 100%; padding: 15px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 20px; }
    .refresh-btn:hover { background: #c73e54; }
    .last-update { text-align: center; color: #666; font-size: 0.85rem; margin-top: 15px; }
    .loading { text-align: center; color: #888; padding: 40px; }
    .error { text-align: center; color: #e94560; padding: 40px; }
    .debug { background: #333; padding: 10px; border-radius: 8px; margin-top: 20px; font-size: 0.8rem; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>小巴 23M</h1>
    <p class="subtitle">麗港城 ↔ 裕民坊</p>
    
    <div class="route-info">
      <div class="route-header">
        <span class="route-number">23M</span>
        <span class="route-direction">往麗港城方向</span>
      </div>
      <div class="stations" id="stations">
        <div class="loading">載入中...</div>
      </div>
    </div>
    
    <button class="refresh-btn" onclick="loadETA()">重新載入</button>
    <p class="last-update" id="lastUpdate"></p>
    <div class="debug" id="debug"></div>
  </div>

  <script>
    const STOPS = [
      { seq: 1, name: "茜發道，近藍田站" },
      { seq: 3, name: "茶果嶺道，近麗港城商場" }
    ];
    const ROUTE_ID = 2008389;
    const ROUTE_SEQ = 2;
    
    async function loadETA() {
      const container = document.getElementById('stations');
      const updateEl = document.getElementById('lastUpdate');
      const debugEl = document.getElementById('debug');
      
      debugEl.textContent = '';
      
      try {
        container.innerHTML = '<div class="loading">載入中...</div>';
        const timestamp = new Date();
        const results = {};
        
        // 測試 API 連接
        debugEl.textContent = '測試 API 連接...';
        
        await Promise.all(STOPS.map(async (stop) => {
          try {
            const url = `https://data.etagmb.gov.hk/eta/route-stop/${ROUTE_ID}/${ROUTE_SEQ}/${stop.seq}`;
            debugEl.textContent += `\n請求: ${url}`;
            
            const response = await fetch(url);
            debugEl.textContent += `\n狀態: ${response.status}`;
            
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            debugEl.textContent += `\n返回: ${JSON.stringify(data).substring(0, 100)}...`;
            
            if (data.data) {
              results[stop.seq] = data.data;
            }
          } catch (e) {
            debugEl.textContent += `\n錯誤: ${e.message}`;
            console.error(`Error fetching stop ${stop.seq}:`, e);
          }
        }));
        
        debugEl.textContent += `\n結果數量: ${Object.keys(results).length}`;
        
        container.innerHTML = '';
        if (Object.keys(results).length === 0) {
          container.innerHTML = '<div class="error">載入失敗，請稍後再試</div>';
          return;
        }
        
        STOPS.forEach(stop => {
          const stopData = results[stop.seq];
          const station = document.createElement('div');
          station.className = 'station';
          
          if (!stopData) {
            station.innerHTML = `
              <div class="station-name">${stop.name}</div>
              <div class="eta-list"><span class="eta">無資料</span></div>
            `;
          } else {
            const etaList = stopData.eta || [];
            const etaHtml = etaList.length > 0 
              ? etaList.map(eta => {
                  const isSoon = eta.diff <= 5;
                  const isScheduled = eta.remarks_tc === "未開出";
                  return `<span class="eta ${isSoon ? 'soon' : (isScheduled ? 'scheduled' : '')}">
                    ${isSoon ? '即時到站' : (isScheduled ? '未開出' : `約 ${eta.diff} 分鐘`)}
                  </span>`;
                }).join('')
              : '<span class="eta">無資料</span>';
            
            station.innerHTML = `
              <div class="station-name">${stop.name}</div>
              <div class="eta-list">${etaHtml}</div>
            `;
          }
          
          container.appendChild(station);
        });
        
        updateEl.textContent = `最後更新：${timestamp.toLocaleTimeString('zh-HK')}`;
        debugEl.textContent += `\n✅ 成功載入 ${Object.keys(results).length} 個站點`;
        
      } catch (e) {
        debugEl.textContent += `\n❌ 錯誤: ${e.message}`;
        console.error('Error:', e);
        container.innerHTML = '<div class="error">載入失敗，請稍後再試</div>';
      }
    }

    loadETA();
    setInterval(loadETA, 30000);
  </script>
</body>
</html>
