<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小巴 23M & 23C 到站時間 - 麗港城</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: #00d4ff; margin-bottom: 10px; font-size: 2rem; }
    .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
    .route-section { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .route-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .route-number { background: #0f3460; color: #00d4ff; padding: 10px 20px; border-radius: 8px; font-size: 1.5rem; font-weight: bold; }
    .route-direction { color: #aaa; }
    .stations { display: flex; flex-direction: column; gap: 15px; }
    .station { background: #0f3460; border-radius: 8px; padding: 15px; border-left: 4px solid #00d4ff; }
    .station-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; }
    .eta-list { display: flex; gap: 10px; flex-wrap: wrap; }
    .eta { background: #1a1a2e; padding: 8px 15px; border-radius: 6px; font-size: 0.95rem; }
    .eta.soon { background: #00d4ff; color: #000; font-weight: bold; }
    .eta.delayed { background: #e94560; color: white; font-weight: bold; }
    .refresh-btn { display: block; width: 100%; padding: 15px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 20px; }
    .refresh-btn:hover { background: #c73e54; }
    .last-update { text-align: center; color: #666; font-size: 0.85rem; margin-top: 15px; }
    .data-source { text-align: center; color: #888; font-size: 0.75rem; margin-top: 20px; line-height: 1.6; }
    .data-source a { color: #00d4ff; text-decoration: none; }
    .data-source a:hover { text-decoration: underline; }
    .loading { text-align: center; color: #888; padding: 40px; }
    .error { text-align: center; color: #e94560; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>小巴 23M & 23C</h1>
    <p class="subtitle">麗港城 ↔ 裕民坊 / 藍田 ↔ 油塘</p>
    
    <div class="route-section">
      <div class="route-header">
        <span class="route-number">23M</span>
        <span class="route-direction">往麗港城方向</span>
      </div>
      <div class="stations" id="stations-23m">
        <div class="loading">載入中...</div>
      </div>
    </div>
    
    <div class="route-section">
      <div class="route-header">
        <span class="route-number">23C</span>
        <span class="route-direction">循環線</span>
      </div>
      <div class="stations" id="stations-23c">
        <div class="loading">載入中...</div>
      </div>
    </div>
    
    <button class="refresh-btn" onclick="loadETA()">重新載入</button>
    <p class="last-update" id="lastUpdate"></p>
    <p class="data-source">
      數據來源：<a href="https://data.gov.hk/tc-data/dataset/hk-td-sm_7-real-time-arrival-data-of-gmb" target="_blank">運輸署綠色專線小巴實時到站數據</a><br>
      資料由數據.gov.hk 提供，受香港特區政府知識產權保護
    </p>
  </div>

  <script>
    const STOPS_23M = [
      { seq: 1, name: "裕民坊公共運輸交匯處" },
      { seq: 3, name: "茶果嶺道，近麗港城商場" },
      { seq: 4, name: "茜發道，近藍田站" }
    ];
    const ROUTE_ID_23M = 2008389;
    const ROUTE_SEQ_23M = 2;
    
    const STOPS_23C = [
      { seq: 2, name: "茜發道，近麗港城第三期" },
      { seq: 3, name: "茶果嶺道，近麗港城商場" },
      { seq: 11, name: "鯉魚門道，近鯉魚門廣場" }
    ];
    const ROUTE_ID_23C = 2008391;
    const ROUTE_SEQ_23C = 1;
    
    async function fetchETA(routeId, routeSeq, stopSeq) {
      try {
        const url = `https://data.etagmb.gov.hk/eta/route-stop/${routeId}/${routeSeq}/${stopSeq}`;
        const response = await fetch(url);
        const data = await response.json();
        if (data.data) return data.data;
      } catch (e) {
        console.error(`Error fetching ${routeId}/${routeSeq}/${stopSeq}:`, e);
      }
      return null;
    }
    
    function renderStation(container, stopName, stopData) {
      const station = document.createElement('div');
      station.className = 'station';
      
      if (!stopData || !stopData.eta || stopData.eta.length === 0) {
        station.innerHTML = `
          <div class="station-name">${stopName}</div>
          <div class="eta-list"><span class="eta">無資料</span></div>
        `;
        container.appendChild(station);
        return;
      }
      
      const etaHtml = stopData.eta.map(eta => {
        const isSoon = eta.diff <= 5;
        const isDelayed = eta.remarks_tc === '行車受阻';
        return `<span class="eta ${isSoon ? 'soon' : isDelayed ? 'delayed' : ''}">
          ${isSoon ? '即時到站' : isDelayed ? `延誤 ${eta.diff} 分鐘` : `約 ${eta.diff} 分鐘`}
        </span>`;
      }).join('');
      
      station.innerHTML = `
        <div class="station-name">${stopName}</div>
        <div class="eta-list">${etaHtml}</div>
      `;
      container.appendChild(station);
    }
    
    async function loadETA() {
      const container23m = document.getElementById('stations-23m');
      const container23c = document.getElementById('stations-23c');
      const updateEl = document.getElementById('lastUpdate');
      
      try {
        container23m.innerHTML = '<div class="loading">載入中...</div>';
        container23c.innerHTML = '<div class="loading">載入中...</div>';
        const timestamp = new Date();
        
        const results23m = {};
        const results23c = {};
        
        await Promise.all([
          ...STOPS_23M.map(async (stop) => {
            const data = await fetchETA(ROUTE_ID_23M, ROUTE_SEQ_23M, stop.seq);
            if (data) results23m[stop.seq] = data;
          }),
          ...STOPS_23C.map(async (stop) => {
            const data = await fetchETA(ROUTE_ID_23C, ROUTE_SEQ_23C, stop.seq);
            if (data) results23c[stop.seq] = data;
          })
        ]);
        
        container23m.innerHTML = '';
        container23c.innerHTML = '';
        
        if (Object.keys(results23m).length === 0) {
          container23m.innerHTML = '<div class="error">載入失敗</div>';
        } else {
          STOPS_23M.forEach(stop => {
            if (results23m[stop.seq]) {
              renderStation(container23m, stop.name, results23m[stop.seq]);
            }
          });
        }
        
        if (Object.keys(results23c).length === 0) {
          container23c.innerHTML = '<div class="error">載入失敗</div>';
        } else {
          STOPS_23C.forEach(stop => {
            if (results23c[stop.seq]) {
              renderStation(container23c, stop.name, results23c[stop.seq]);
            }
          });
        }
        
        updateEl.textContent = `最後更新：${timestamp.toLocaleTimeString('zh-HK')}`;
        
      } catch (e) {
        console.error('Error:', e);
        container23m.innerHTML = '<div class="error">載入失敗，請稍後再試</div>';
        container23c.innerHTML = '<div class="error">載入失敗，請稍後再試</div>';
      }
    }

    loadETA();
    setInterval(loadETA, 30000);
  </script>
</body>
</html>
