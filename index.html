<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麗港城巴士到站時間 - 40號 & 219X</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f7; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .route-header { display: flex; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e0e0e0; }
        .route-number { background: #1a73e8; color: white; padding: 8px 15px; border-radius: 20px; font-size: 18px; font-weight: bold; margin-right: 12px; }
        .route-info h2 { font-size: 18px; color: #333; }
        .route-info p { font-size: 13px; color: #666; margin-top: 2px; }
        .bus-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .bus-item:last-child { border-bottom: none; }
        .bus-plate { background: #f5f5f7; padding: 4px 10px; border-radius: 6px; font-size: 12px; color: #666; }
        .bus-eta { font-size: 20px; font-weight: bold; color: #1a73e8; }
        .bus-eta.imminent { color: #d32f2f; }
        .bus-eta.arriving { background: #d32f2f; color: white; padding: 4px 12px; border-radius: 15px; font-size: 14px; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .error { text-align: center; padding: 20px; color: #d32f2f; }
        .refresh-btn { display: block; width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .refresh-btn:hover { background: #1557b0; }
        .time-info { text-align: center; font-size: 12px; color: #999; margin-top: 10px; }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; margin-left: 8px; }
        .status-badge.live { background: #e8f5e9; color: #2e7d32; }
        .route-label { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚌 麗港城巴士到站時間</h1>
        <p>40號 & 219X 從麗港城出發</p>
    </div>
    
    <div class="container">
        <div class="card">
            <div class="route-header">
                <span class="route-number">40</span>
                <div class="route-info">
                    <h2>麗港城 → 荃灣(麗城花園)</h2>
                    <p>麗港城總站 (LT972)</p>
                </div>
            </div>
            <div id="route40-content">
                <div class="loading">載入中...</div>
            </div>
        </div>
        
        <div class="card">
            <div class="route-header">
                <span class="route-number">219X</span>
                <div class="route-info">
                    <h2>麗港城 → 尖沙咀</h2>
                    <p>麗港城總站 (LT970)</p>
                </div>
            </div>
            <div id="route219x-content">
                <div class="loading">載入中...</div>
            </div>
        </div>
        
        <button class="refresh-btn" onclick="loadAll()">🔄 重新整理</button>
        <div class="time-info" id="last-update"></div>
    </div>

    <script>
        const STOP_40 = 'C645EAB71B49A03C';
        const STOP_219X = '272E83ECF9FF074D';
        
        async function fetchBusData(stopId) {
            try {
                console.log('Fetching data for stop:', stopId);
                const resp = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                console.log('Response status:', resp.status);
                const data = await resp.json();
                console.log('Data received:', data.data ? data.data.length + ' items' : 'No data');
                return data;
            } catch (e) {
                console.error('Fetch error:', e);
                return { data: [] };
            }
        }
        }
        
        function calculateMinutes(etaStr) {
            const eta = new Date(etaStr);
            const now = new Date();
            const diff = (eta - now) / 1000 / 60; // 分鐘
            return Math.max(0, Math.round(diff));
        }
        
        function renderBuses(containerId, data, routeNum) {
            const container = document.getElementById(containerId);
            if (!data || !data.data || data.data.length === 0) {
                container.innerHTML = '<div class="error">暫無到站資訊</div>';
                return;
            }
            
            // 過濾只顯示出發方向
            // 40號: dir=I 是往荃灣(麗城花園)
            // 219X: dir=O 是往尖沙咀
            const is40 = routeNum === 40;
            const filtered = data.data.filter(item => is40 ? item.dir === 'I' : item.dir === 'O');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="error">暫無出發方向到站資訊</div>';
                return;
            }
            
            let html = '';
            const etas = filtered.slice(0, 5);
            
            etas.forEach(item => {
                const minutes = calculateMinutes(item.eta);
                const dest = item.dest_tc || item.dest_en || '未知';
                let etaClass = 'bus-eta';
                let etaText = minutes + ' 分鐘';
                
                if (minutes <= 1) {
                    etaClass += ' arriving';
                    etaText = '即將到站';
                } else if (minutes <= 3) {
                    etaClass += ' imminent';
                }
                
                html += `
                    <div class="bus-item">
                        <div>
                            <span class="bus-plate">${item.route} → ${dest}</span>
                            <div class="route-label">路線 ${item.seq}</div>
                        </div>
                        <span class="${etaClass}">${etaText}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        async function loadAll() {
            document.getElementById('route40-content').innerHTML = '<div class="loading">載入中...</div>';
            document.getElementById('route219x-content').innerHTML = '<div class="loading">載入中...</div>';
            
            const [data40, data219X] = await Promise.all([
                fetchBusData(STOP_40),
                fetchBusData(STOP_219X)
            ]);
            
            renderBuses('route40-content', data40, 40);
            renderBuses('route219x-content', data219X, 219X);
            
            const now = new Date();
            document.getElementById('last-update').textContent = 
                '最後更新：' + now.toLocaleTimeString('zh-HK') + ' <span class="status-badge live">● 即時</span>';
        }
        
        // Load on page load
        loadAll();
        
        // Auto-refresh every 60 seconds
        setInterval(loadAll, 60000);
    </script>
</body>
</html>
